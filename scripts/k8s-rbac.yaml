# k8s-rbac.yaml — RBAC permissions for the k8s-connector service
# Apply with: kubectl apply -f scripts/k8s-rbac.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: techgraph-k8s-connector
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: techgraph-service-reader
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: techgraph-service-reader-binding
subjects:
  - kind: ServiceAccount
    name: techgraph-k8s-connector
    namespace: default
roleRef:
  kind: ClusterRole
  name: techgraph-service-reader
  apiGroup: rbac.authorization.k8s.io
