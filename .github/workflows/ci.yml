name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  go-build-and-test:
    name: Go — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"   # always matches developer environment
          cache: true

      - name: Verify go.mod consistency
        # Fail if go.sum is out of sync (catches missing go.sum entries)
        run: |
          (cd pkg/graphclient && go mod verify) || exit 1
          for svc in detection-engine api-gateway rca-ranker signal-ingestion graph-manager \
                     code-indexer onboarding-worker health-poller k8s-connector; do
            echo "Checking $svc go.mod..."
            (cd services/$svc && go mod verify) || exit 1
          done

      - name: Build all Go services
        run: |
          for svc in detection-engine api-gateway rca-ranker signal-ingestion graph-manager \
                     code-indexer onboarding-worker demo-services health-poller \
                     recommendation k8s-connector otel-receiver; do
            echo "Building $svc..."
            (cd services/$svc && go build ./...) || exit 1
          done

      - name: Run Go tests
        run: |
          for svc in detection-engine api-gateway rca-ranker signal-ingestion; do
            echo "Testing $svc..."
            (cd services/$svc && go test ./... -timeout 60s -race) || exit 1
          done

      - name: Run go vet
        run: |
          for svc in detection-engine api-gateway signal-ingestion; do
            echo "Vetting $svc..."
            (cd services/$svc && go vet ./...)
          done

  migrations:
    name: Migrations — Apply Clean, Then Re-Apply
    runs-on: ubuntu-latest
    # Migrations are load-bearing for the demo (the seed migration creates the
    # tenants and projects a fresh stack needs), so prove they apply from empty
    # and stay idempotent when re-run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faultiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to an empty database
        env:
          PG_DSN: postgres://postgres:postgres@localhost:5432/faultiq?sslmode=disable
          PG_HOST: localhost
          PG_PORT: "5432"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          chmod +x scripts/migrations/run_migrations.sh
          sh scripts/migrations/run_migrations.sh

      - name: Re-apply to prove idempotency
        env:
          PG_DSN: postgres://postgres:postgres@localhost:5432/faultiq?sslmode=disable
          PG_HOST: localhost
          PG_PORT: "5432"
        run: sh scripts/migrations/run_migrations.sh

      - name: Assert the demo seed produced tenants and projects
        env:
          PG_DSN: postgres://postgres:postgres@localhost:5432/faultiq?sslmode=disable
        run: |
          psql "$PG_DSN" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM tenants"      | grep -qx '2'
          psql "$PG_DSN" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM projects"     | grep -qx '2'

  frontend:
    name: Frontend — TypeScript & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Check for vulnerabilities
        # Fail on high/critical — these must be fixed before merging
        run: cd frontend && npm audit --audit-level=high
