services:
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    environment:
      - AUTH_MODE=jwks
      - JWKS_URL=http://keycloak:8080/realms/faultiq/protocol/openid-connect/certs
      - JWKS_REFRESH_INTERVAL=1m
      # Optional strict validation for issuer and audience
      - AUTH_ISSUER=http://localhost:8081/realms/faultiq
      - AUTH_AUDIENCE=
      - API_KEY_SECRET=${API_KEY_SECRET:-}    # set this to enable CI/CD auth
      - DEFAULT_TENANT=${DEFAULT_TENANT:-acme-corp}
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:5.8
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "${NEO4J_ACCEPT_LICENSE_AGREEMENT}"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080"
    volumes:
      - ./scripts/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    command: ["start-dev", "--http-enabled=true", "--import-realm"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/faultiq/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  graph-manager:
    build:
      context: .
      dockerfile: ./services/graph-manager/Dockerfile
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - REDIS_ADDR=${REDIS_ADDR}
      - GRAPH_MANAGER_ADDR=${GRAPH_MANAGER_ADDR}
    ports:
      - "8086:8086"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  signal-ingestion:
    build:
      context: .
      dockerfile: ./services/signal-ingestion/Dockerfile
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - INGESTION_PORT=${INGESTION_PORT}
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  detection-engine:
    build:
      context: .
      dockerfile: ./services/detection-engine/Dockerfile
    environment:
      - PG_DSN=${PG_DSN}
      - REDIS_ADDR=redis:6379
      - GRAPH_MANAGER_URL=${GRAPH_MANAGER_URL}
      - NAMESPACE=${NAMESPACE}
      - RCA_RANKER_URL=http://rca-ranker:8087
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL:-}
      - P1_WEBHOOK_URL=${P1_WEBHOOK_URL:-}   # PagerDuty/OpsGenie for service-down and cascading
      - P2_WEBHOOK_URL=${P2_WEBHOOK_URL:-}   # Slack/Teams for latency and transient faults
      - CODE_INDEXER_URL=http://code-indexer:8092
      - RECOMMENDATION_SERVICE_URL=http://recommendation:8090
      - SLA_ESCALATION_MINUTES=30
      - API_GATEWAY_URL=http://api-gateway:8080
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      graph-manager:
        condition: service_healthy
      rca-ranker:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      signal-ingestion:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db-migrate:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PG_DSN=${PG_DSN}
    volumes:
      - ./scripts/migrations:/migrations:ro
    entrypoint: ["/bin/sh","-c","cp /migrations/run_migrations.sh /tmp/run_migrations.sh && sed -i 's/\\r$//' /tmp/run_migrations.sh && chmod +x /tmp/run_migrations.sh && /bin/sh /tmp/run_migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  onboarding-worker:
    build:
      context: .
      dockerfile: ./services/onboarding-worker/Dockerfile
    environment:
      - REDIS_ADDR=redis:6379
      - PG_DSN=${PG_DSN}
      - GRAPH_MANAGER_URL=http://graph-manager:8086/api/v1/graphs
      - SERVICE_MAP_FILE=/etc/onboarding/service-map.yaml
      - K8S_CONNECTOR_URL=http://k8s-connector:8093
    volumes:
      - ./scripts/service-map.yaml:/etc/onboarding/service-map.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      graph-manager:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

  # demo-services: configurable mock HTTP services for local demos.
  # Use PUT /admin/services/{name}/status to inject faults.
  demo-services:
    build:
      context: .
      dockerfile: ./services/demo-services/Dockerfile
    ports:
      - "8091:8091"
    environment:
      - DEMO_SERVICES_PORT=8091
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # code-indexer: clones repos, extracts functions, writes to Neo4j for code-level RCA.
  # Disk lifecycle: shallow clone → analyze → rm -rf → disk freed. Only uses disk during analysis.
  # Webhook trigger: POST http://localhost:8092/index  (call from CI/CD on push)
  # Per-service:    POST http://localhost:8092/index/service/{serviceId}
  code-indexer:
    build:
      context: .
      dockerfile: ./services/code-indexer/Dockerfile
    environment:
      - SERVICE_MAP_FILE=/etc/code-indexer/service-map.yaml
      - GRAPH_MANAGER_URL=http://graph-manager:8086/api/v1/graphs
      - PG_DSN=${PG_DSN}
      - INDEX_INTERVAL_MINUTES=60          # re-index every 60 minutes
      - CODE_INDEXER_PORT=8092
      # Optional: SSH key for private repos (mount as secret in production)
      # - GIT_SSH_COMMAND=ssh -i /etc/ssh/id_rsa -o StrictHostKeyChecking=no
    volumes:
      - ./scripts/service-map.yaml:/etc/code-indexer/service-map.yaml:ro
    ports:
      - "8092:8092"
    depends_on:
      graph-manager:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m

  # health-poller: autonomously polls registered service health endpoints
  # and posts signals to signal-ingestion every POLL_INTERVAL_SECONDS.
  # This is what makes fault detection truly automated.
  health-poller:
    build:
      context: .
      dockerfile: ./services/health-poller/Dockerfile
    environment:
      - SERVICE_MAP_FILE=/etc/health-poller/service-map.yaml
      - SIGNAL_INGESTION_URL=http://signal-ingestion:8085
      - POLL_INTERVAL_SECONDS=30
    volumes:
      - ./scripts/service-map.yaml:/etc/health-poller/service-map.yaml:ro
    depends_on:
      signal-ingestion:
        condition: service_healthy
      demo-services:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m

  detection-stack:
    image: alpine:3.18
    command: ["sh","-c","while true; do sleep 3600; done"]
    depends_on:
      - detection-engine
      - graph-manager
      - neo4j
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time client-facing defaults (baked into the frontend bundle).
        # Override these by setting the env vars on the host before building for prod.
        NEXT_PUBLIC_API_GATEWAY_URL: "http://localhost:8080/api/v1"
        NEXT_PUBLIC_WEBSOCKET_URL: "ws://localhost:8085"
        NEXT_PUBLIC_AUTH_URL: "http://localhost:8081"
        NEXT_PUBLIC_KEYCLOAK_REALM: "${NEXT_PUBLIC_KEYCLOAK_REALM:-faultiq}"
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-faultiq-ui}"
        NEXT_PUBLIC_HOST_URL: "${NEXT_PUBLIC_HOST_URL:-http://localhost:4001}"
    container_name: faultiq-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    environment:
      # Internal Docker network URLs for API calls
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:8085
      - NEXT_PUBLIC_AUTH_URL=http://localhost:8081
      # Status API used by the services-status page (defaults to API Gateway)
      - NEXT_PUBLIC_STATUS_API_URL=http://localhost:8080
      # Server/runtime addresses (used by Next server-side code inside the container)
      - SERVER_API_GATEWAY_URL=${SERVER_API_GATEWAY_URL:-http://api-gateway:8080/api/v1}
      - SERVER_AUTH_URL=${SERVER_AUTH_URL:-http://keycloak:8080}
      # Keycloak configuration
      - NEXT_PUBLIC_KEYCLOAK_REALM=${NEXT_PUBLIC_KEYCLOAK_REALM:-faultiq}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-faultiq-ui}
      # For browser redirect (important for OAuth callback)
      - NEXT_PUBLIC_KEYCLOAK_REDIRECT_URI=${NEXT_PUBLIC_KEYCLOAK_REDIRECT_URI:-http://localhost:4001}
      - NEXT_PUBLIC_HOST_URL=${NEXT_PUBLIC_HOST_URL:-http://localhost:4001}
      # App settings
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-production}
      - NEXT_PUBLIC_APP_NAME=FaultIQ
      - NEXT_PUBLIC_ENABLE_ANALYTICS=${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
      - NEXT_PUBLIC_ENABLE_DARK_MODE=${NEXT_PUBLIC_ENABLE_DARK_MODE:-true}
      - NEXT_PUBLIC_ENABLE_API_EXPLORER=${NEXT_PUBLIC_ENABLE_API_EXPLORER:-true}
      - NEXT_PUBLIC_ENABLE_DOCUMENTATION=${NEXT_PUBLIC_ENABLE_DOCUMENTATION:-true}
      - NEXT_PUBLIC_ENABLE_MONITORING=${NEXT_PUBLIC_ENABLE_MONITORING:-true}
      - NODE_ENV=production
      - PORT=4001
      # Public-facing Keycloak URL used by the frontend proxy to rewrite issuer
      - AUTH_PUBLIC_URL=${NEXT_PUBLIC_AUTH_URL:-http://localhost:8081}
    ports:
      - "4001:4001"
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Use the default Compose network so frontend can resolve other services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  recommendation:
    build:
      context: .
      dockerfile: ./services/recommendation/Dockerfile
    environment:
      - RECOMMENDATIONS_PATH=/recommendations.json
    ports:
      - "8090:8090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  rca-ranker:
    build:
      context: .
      dockerfile: ./services/rca-ranker/Dockerfile
    environment:
      - PG_DSN=${PG_DSN}
      - RCA_RANKER_PORT=:8087
      # Disable MPTCP and async preemption to fix SIGSEGV in Go runtime netpoll on Docker/macOS
      - GODEBUG=mptcpEnabled=0,asyncpreemptoff=1
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  k8s-connector:
    build:
      context: .
      dockerfile: ./services/k8s-connector/Dockerfile
    environment:
      - PORT=8093
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-}   # leave empty for in-cluster mode
      - K8S_CONNECTOR_API_KEY=${K8S_CONNECTOR_API_KEY:-}
    ports:
      - "8093:8093"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  otel-receiver:
    build:
      context: .
      dockerfile: ./services/otel-receiver/Dockerfile
    environment:
      - SIGNAL_INGESTION_URL=http://signal-ingestion:8085
      - OTEL_RECEIVER_PORT=4318
      - OTEL_API_KEY=${OTEL_API_KEY:-}   # leave empty to disable auth in dev
      - GRAPH_MANAGER_URL=http://graph-manager:8086
      - OTEL_DEFAULT_NAMESPACE=${OTEL_DEFAULT_NAMESPACE:-otel-auto:prod}
    ports:
      - "4318:4318"    # standard OTel HTTP port
    depends_on:
      signal-ingestion:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4318/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── TLS profile — enable with: docker compose --profile tls up ────────────
  # Prerequisites: place certs at ./certs/fullchain.pem and ./certs/privkey.pem
  nginx-tls:
    profiles: ["tls"]
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./scripts/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    restart: unless-stopped

  # ── Redis HA profile — enable with: docker compose --profile redis-ha up ──
  redis-replica:
    profiles: ["redis-ha"]
    image: redis:7-alpine
    command: redis-server --replicaof redis 6379 --appendonly yes
    depends_on: [redis]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  redis-sentinel-1:
    profiles: ["redis-ha"]
    image: redis:7-alpine
    command: >
      sh -c "printf 'port 26379\nsentinel monitor mymaster redis 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 60000\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    depends_on: [redis, redis-replica]
    ports: ["26379:26379"]
    restart: unless-stopped

  redis-sentinel-2:
    profiles: ["redis-ha"]
    image: redis:7-alpine
    command: >
      sh -c "printf 'port 26380\nsentinel monitor mymaster redis 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 60000\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    depends_on: [redis, redis-replica]
    ports: ["26380:26380"]
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
  redis_data:

networks:
  faultiq-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   Default:          docker compose up --build
#   With TLS:         docker compose --profile tls up --build
#   With Redis HA:    docker compose --profile redis-ha up --build
#   Both:             docker compose --profile tls --profile redis-ha up --build
# ─────────────────────────────────────────────────────────────────────────────
