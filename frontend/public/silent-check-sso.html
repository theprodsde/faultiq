<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Silent SSO</title>
  </head>
  <body>
    <script>
      // Post the current location to the parent window for Keycloak silent check
      try {
        parent.postMessage(location.href, location.origin);
      } catch (e) {
        // fallback: allow any origin if origin mismatch
        parent.postMessage(location.href, '*');
      }
    </script>
  </body>
</html>
